# SES Controller Configuration - Experiment 2 (Visual Occlusion)
# These parameters can be modified without rebuilding the package.
# If a parameter is not specified here, the default value in the code will be used.

experiment_name: "exp10_visibility"  # Used for logging and saving results

# Controller timing
dt: 0.05
max_steps: 7500
num_modes: 15

# Parameter Bounds relative to the EE initial position
K_MIN_rel: -0.03    # X minimum offset
K_MAX_rel: 0.27  #0.27 # X maximum offset
L1_MIN_rel: -0.13  #0.2  # Z minimum offset
L1_MAX_rel: 0.27 #0.25   # Z maximum offset

# Features
d_feat: 1 # Dimensionality of features
n_feat: 1  # Total number of features on the rod (tracked or not)
tracked_feat: [0]  # Indexes of the features being tracked (starting from 0)

# Visualization settings
enable_visualization: true
viz_update_rate: 5  # Update visualization every N steps

# Progress-Variable Dynamics
gate_gamma: 5.0
gate_E_ref: 0.07 #0.08

# Temperature schedule: θ(s) = θ_0 / ln(e + λ_θ s)
theta_0: 5.0
lambda_theta: 7.0 #10.0

# Memory schedule: T(s) = T_0 * exp(-λ_T s)
T_0: 40.0 #20.0
lambda_T: 0.075 #0.1

# Mixing dynamics: dα/dt = κ_α θ(s)^2 ρ(E)
kappa_alpha: 0.015 #0.01

# ========== PERTURBATION (auto disturbance detection + exploration reset) ==========
# Two-phase: (1) disturbance injected at disturbance_time (silent target swap)
#             (2) D(t) auto-detects the error spike and triggers exploration reset
# D(t) = |e(t) - e(t-W)| / (||q(t) - q(t-W)|| + eps)
# Reset trigger: converged (mean_e < e_conv_threshold) AND D(t) > D_threshold
perturbation_enabled: true

# Disturbance injection: time at which targets are silently swapped
# Default = 0.5 * max_steps * dt (half of total time)
disturbance_step: 1500

# Disturbance detection parameters
detect_window_sec: 1.5        # Sliding window width for D(t) computation [s]
stable_window_sec: 10.0       # Longer horizon to confirm system truly settled [s]
e_conv_threshold: 0.02        # Max error spread over stable_window to count as \"settled\" [m]
D_threshold: 5.0              # Disturbance indicator threshold (positive = error increased)
detect_min_time: 160.0         # Ignore before this time [s] (skip initial transients)

# New feature target positions after perturbation (lower + more to the right)
#perturbation_r_targ: [[0.52, 0.63],[0.22, 0.30]] #X, Z
perturbation_r_targ: [[72]] #Angle

# Gaussian prior sigma for post-perturbation local exploration
# Controls the width of the Gaussian centered on current EE (in normalized coords)
# Smaller = tighter local search, larger = more exploration
perturbation_prior_sigma: 0.15

# Sobolev exponent
s_sobolev: 1.3

# Bayesian Parameters
sigma_apriori: 0.25
sigma_meas_norm: 0.01
sigma_likelihood: 0.025 #0.025

# Grid Setup
N_grid: 200
